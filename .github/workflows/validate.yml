name: Flutter checks
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
      - run: flutter pub get
      - run: dart format lib test integration_test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Python source-level regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Python test harness syntax
        run: python -m py_compile tests/*.py
      - run: flutter build apk --debug --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=YOUR_PLACEHOLDER

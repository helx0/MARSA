pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file('local.properties')
        assert localPropertiesFile.exists() : 'Run flutter pub get or flutter create . to set flutter.sdk'
        localPropertiesFile.withInputStream { properties.load(it) }
        def sdk = properties.getProperty('flutter.sdk')
        assert sdk != null : 'flutter.sdk not found in local.properties'
        return sdk
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.10' apply false
}
include ':app'

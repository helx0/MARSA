name: marsa
version: 1.0.0+1
description: Arabic-first seafood marketplace for Aden, Yemen.
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.9.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
